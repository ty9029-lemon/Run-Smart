<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 첫 화면이 그려지기 전에 저장된 테마를 적용해 깜빡임을 막는다.
         키·값은 src/constants/theme.ts의 THEME_STORAGE_KEY, THEME_COLOR_META와 맞춘다. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('run-smart-theme');
          var mode = raw ? JSON.parse(raw).state.mode : 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#111111' : '#ffffff');
        } catch (e) {
          /* 저장값을 읽지 못하면 CSS 기본값(라이트)과 useTheme에 맡긴다 */
        }
      })();
    </script>
    <title>Run Smart</title>
    <meta
      name="description"
      content="날씨 보고 러닝 여부와 복장을 한눈에 알려드려요"
    />

    <!-- 링크 공유 미리보기 (카카오톡, X, 스레드, 인스타그램 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Run Smart" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://runners-fit.vercel.app/" />
    <meta property="og:title" content="오늘 뛸까, 말까? Run Smart" />
    <meta
      property="og:description"
      content="날씨 보고 러닝 여부와 복장을 한눈에 알려드려요"
    />
    <meta property="og:image" content="https://runners-fit.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="오늘 뛸까, 말까? Run Smart" />
    <meta
      name="twitter:description"
      content="날씨 보고 러닝 여부와 복장을 한눈에 알려드려요"
    />
    <meta name="twitter:image" content="https://runners-fit.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
